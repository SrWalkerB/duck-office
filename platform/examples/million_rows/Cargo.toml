[package]
name = "million_rows"
description = "Exemplo da camada platform/: grade de 1 milhão de linhas, sem nenhum crate de office."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
duck-platform = { path = "../../duck-platform" }
duck-gfx = { path = "../../duck-gfx" }
duck-text = { path = "../../duck-text" }
png = "0.18.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
