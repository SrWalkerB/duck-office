[package]
name = "duck-bench"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
calamine = "0.38.0"
duck-calc = { version = "0.1.0", path = "../duck-calc" }
duck-core = { version = "0.1.0", path = "../duck-core" }
duck-deflate = { version = "0.1.0", path = "../duck-deflate" }
duck-par = { version = "0.1.0", path = "../duck-par" }
duck-xlsx = { version = "0.1.0", path = "../duck-xlsx" }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = "0.1.52"
rayon = "1.12.0"
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
