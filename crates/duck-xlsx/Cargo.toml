[package]
name = "duck-xlsx"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
duck-calc = { path = "../duck-calc" }
duck-core = { path = "../duck-core" }
duck-deflate = { path = "../duck-deflate" }
duck-par = { path = "../duck-par" }
crc32fast = "1.5.5"
fast-float2 = "0.2.4"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha1 = "0.11.0"
sha2 = "0.11.1"

[dev-dependencies]
# Leitor independente, para conferir o `.xlsb`.
calamine = "0.38.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory"] }
