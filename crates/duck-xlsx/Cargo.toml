[package]
name = "duck-xlsx"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
duck-calc = { version = "0.1.0", path = "../duck-calc" }
duck-core = { version = "0.1.0", path = "../duck-core" }
duck-deflate = { version = "0.1.0", path = "../duck-deflate" }
duck-par = { version = "0.1.0", path = "../duck-par" }
fast-float2 = "0.2.4"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory"] }
