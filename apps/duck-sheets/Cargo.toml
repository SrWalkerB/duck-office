[package]
name = "duck-sheets"
description = "Visualizador de planilhas .xlsx/.xlsm nativo e rápido (F2)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
duck-calc = { path = "../../crates/duck-calc" }
duck-core = { path = "../../crates/duck-core" }
duck-dax = { path = "../../crates/duck-dax" }
duck-emf = { path = "../../crates/duck-emf" }
duck-gfx = { path = "../../platform/duck-gfx" }
duck-par = { path = "../../crates/duck-par" }
duck-platform = { path = "../../platform/duck-platform" }
duck-text = { path = "../../platform/duck-text" }
duck-ui = { path = "../../platform/duck-ui" }
duck-vba = { path = "../../crates/duck-vba" }
duck-xlsx = { path = "../../crates/duck-xlsx" }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = "0.1.52"
png = "0.18.1"
rayon = "1.12.0"
zune-jpeg = "0.5.15"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
