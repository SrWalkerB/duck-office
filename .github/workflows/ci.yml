name: CI

on:
  push:
    # Estas têm o fluxo delas (release.yml) ou só o manifesto das atualizações.
    branches-ignore: ["release/**", "atualizacoes"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Testes
        run: cargo test --workspace

      - name: platform/ independente da suíte
        shell: bash
        run: scripts/check-platform-deps.sh

      - name: Build release
        run: cargo build --workspace --release

      # Planilha sintética lida pelo duck-xlsx e conferida célula a célula
      # contra o calamine, com pedaços de 1 MB para exercitar os cortes.
      - name: duck-xlsx × calamine
        shell: bash
        run: |
          ./target/release/duck-bench gen target/synth.xlsx --rows 100000 --small-sheets 3
          ./target/release/duck-bench verify target/synth.xlsx --chunk-mb 1
          ./target/release/duck-bench verify target/synth.xlsx --chunk-mb 1 --threads 1
          ./target/release/duck-bench open target/synth.xlsx
          ./target/release/duck-bench gen-showcase target/vitrine.xlsx
          ./target/release/duck-bench verify target/vitrine.xlsx
          ./target/release/duck-bench gen target/synth.xlsb --rows 100000 --small-sheets 3
          ./target/release/duck-bench verify target/synth.xlsb --chunk-mb 1
          ./target/release/duck-bench verify target/synth.xlsb --chunk-mb 1 --threads 1

      # Salvar (F3): cópia intacta, reescrita de todas as células e edições,
      # cada uma relida e conferida contra o modelo e o calamine.
      - name: Round-trip
        shell: bash
        run: |
          for f in target/synth.xlsx target/vitrine.xlsx; do
            ./target/release/duck-bench roundtrip "$f"
            ./target/release/duck-bench roundtrip "$f" --rewrite-all
            ./target/release/duck-bench roundtrip "$f" --edit 500
            ./target/release/duck-bench roundtrip "$f" --estrutura
            ./target/release/duck-bench roundtrip "$f" --abas --celulas
            ./target/release/duck-bench roundtrip "$f" --estrutura --abas --celulas
          done
          # Pasta binária: convertida para .xlsm, com edições e mudanças de estrutura.
          ./target/release/duck-bench roundtrip target/synth.xlsb --edit 500
          ./target/release/duck-bench roundtrip target/synth.xlsb --estrutura --abas --celulas

      # As fórmulas da vitrine, digitadas de novo, passam na conferência.
      - name: Fórmulas digitadas
        shell: bash
        run: ./target/release/duck-bench conferir-formulas target/vitrine.xlsx

      # Contagens e acertos da vitrine (formas, gráficos, fórmulas, links,
      # salvar) contra a linha de base do repositório.
      - name: Regressão
        shell: bash
        run: ./target/release/duck-bench regress target/vitrine.xlsx --base scripts/bench/vitrine.txt
