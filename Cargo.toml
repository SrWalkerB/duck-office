[workspace]
resolver = "3"
members = [
    "platform/duck-platform",
    "platform/duck-gfx",
    "platform/duck-text",
    "platform/duck-ui",
    "platform/examples/million_rows",
    "apps/duck-sheets",
    "crates/duck-core",
    "crates/duck-par",
    "crates/duck-deflate",
    "crates/duck-xlsx",
    "crates/duck-calc",
    "crates/duck-emf",
    "crates/duck-vba",
    "crates/duck-dax",
    "crates/duck-bench",
]

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"
publish = false
rust-version = "1.95"

[profile.dev.package."*"]
# Dependências (wgpu, cosmic-text, swash...) otimizadas mesmo em debug:
# mantém o modo dev utilizável sem pagar o tempo de compilação no nosso código.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
